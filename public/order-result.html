<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>訂單結果｜包安心 Peace of Mind</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="container nav-wrap">
    <a href="index.html" class="logo">
      包安心
      <span class="sub">Peace of Mind</span>
    </a>
    <nav class="main-nav">
      <a href="index.html#shop">全部商品</a>
      <a href="index.html#faq">常見問題</a>
      <a href="index.html#footer">聯絡我們</a>
    </nav>
    <div class="header-actions"></div>
  </div>
</header>

<section style="padding:120px 0; text-align:center;">
  <div class="container" style="max-width:560px;">
    <div id="result-icon" style="font-size:48px; margin-bottom:20px;">🛍</div>
    <h2 class="section-title" id="result-title">訂單處理中</h2>
    <p class="section-desc" id="result-desc"></p>
    <p style="margin-top:10px; color:#706a62; font-size:13.5px;">訂單編號：<strong id="result-order-id">—</strong></p>
    <div style="margin-top:36px;">
      <a href="index.html#shop" class="btn btn-primary">繼續選購</a>
    </div>
  </div>
</section>

<footer class="site-footer">
  <div class="footer-bottom">© 2026 包安心 Peace of Mind｜達勝創新有限公司 版權所有</div>
</footer>

<script>
  const params = new URLSearchParams(window.location.search);
  const orderId = params.get("orderId") || "—";
  const status = params.get("status") || "unknown";
  const codMethod = params.get("codMethod") || "home";
  const COD_METHOD_LABEL = { home: "宅配到府", "711": "7-11 取貨付款", family: "全家取貨付款" };

  document.getElementById("result-order-id").textContent = orderId;

  const titleEl = document.getElementById("result-title");
  const descEl = document.getElementById("result-desc");
  const iconEl = document.getElementById("result-icon");

  if (status === "cod") {
    iconEl.textContent = "🚚";
    titleEl.textContent = "訂單成立，感謝您的訂購";
    descEl.textContent = `已選擇貨到付款（${COD_METHOD_LABEL[codMethod] || "宅配到府"}），運費 NT$60 已計入訂單金額。我們將於 1–3 個工作日內安排出貨，請保持電話暢通。`;
    setTimeout(() => window.celebrateBurst && window.celebrateBurst(iconEl), 300);
  } else if (status === "paid") {
    iconEl.textContent = "✅";
    titleEl.textContent = "付款成功";
    descEl.textContent = "感謝您透過線上結帳完成付款，我們將盡快為您安排出貨（免運費）。";
    setTimeout(() => window.celebrateBurst && window.celebrateBurst(iconEl), 300);
  } else if (status === "failed") {
    iconEl.textContent = "⚠️";
    titleEl.textContent = "付款未完成";
    descEl.textContent = "很抱歉，本次線上付款未成功。您可以返回商品頁重新結帳，或改選貨到付款。";
  } else {
    iconEl.textContent = "🛍";
    titleEl.textContent = "訂單處理中";
    descEl.textContent = "系統正在確認您的訂單狀態，如有疑問歡迎聯繫客服 02-2938-5808。";
  }
</script>
<script src="js/celebrate.js"></script>
<script src="js/back-to-top.js"></script>
<script src="js/paw-trail.js"></script>
</body>
</html>
